name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32v1-none

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -p starfund_escrow -- --check

      - name: Clippy
        run: cargo clippy -p starfund_escrow -- -D warnings

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Add WASM target
        run: rustup target add wasm32v1-none
      - name: Build WASM
        run: cargo build --target wasm32v1-none --release -p starfund_escrow

      - name: Upload release WASM review artifact
        uses: actions/upload-artifact@v4
        with:
          name: starfund-escrow-wasm
          path: target/wasm32v1-none/release/starfund_escrow.wasm
          if-no-files-found: error

      - name: Workspace Clippy (all targets)
        run: cargo clippy -p starfund_escrow --all-targets -- -D warnings

      - name: Check coverage (report)
        run: |
          cargo llvm-cov \
            --features testutils \
            --summary-only \
            --fail-under-lines 90 \
            -p starfund_escrow

  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit dependencies
        run: cargo audit --locked

  openapi-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [18, 20, 22]
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate docs/openapi.yaml
        run: npm test

